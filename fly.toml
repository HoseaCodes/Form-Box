app = "formbox-htx"
primary_region = "dfw"

[env]
  PUBLIC_URL = "https://formbox-htx.fly.dev"
  TRUST_PROXY = "true"

# SQLite lives on this volume; keep the app at a single machine.
[[mounts]]
  source = "formbox_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
